<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <!-- 服務項目「運動貼紮」示意圖：一捲天空藍肌內效貼布、拉出的一段貼布，與剪成 Y 字形的貼布條 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF7FD"/>
      <stop offset="1" stop-color="#D6EBF8"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#bg)"/>

  <!-- 從捲筒底下拉出來的一段貼布 -->
  <ellipse cx="420" cy="398" rx="250" ry="10" fill="#0A6AA8" opacity=".07"/>
  <rect x="230" y="356" width="420" height="34" rx="17" fill="#7CC3EE"/>
  <line x1="300" y1="373" x2="628" y2="373" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 9" opacity=".7"/>

  <!-- 貼布捲 -->
  <circle cx="230" cy="236" r="150" fill="#1F86C6"/>
  <circle cx="230" cy="236" r="138" fill="#3FA0DC"/>
  <circle cx="230" cy="236" r="114" fill="none" stroke="#62B5E8" stroke-width="2" opacity=".8"/>
  <circle cx="230" cy="236" r="94" fill="none" stroke="#62B5E8" stroke-width="2" opacity=".6"/>
  <circle cx="230" cy="236" r="72" fill="#F6FBFE"/>
  <circle cx="230" cy="236" r="54" fill="#DCEEFA"/>

  <!-- 剪成 Y 字形的貼布條（一端整片、另一端分成兩尾） -->
  <g transform="rotate(-10 548 176)">
    <rect x="502" y="140" width="150" height="72" rx="36" fill="#2F95D3"/>
    <rect x="404" y="140" width="150" height="31" rx="15.5" fill="#2F95D3"/>
    <rect x="404" y="181" width="150" height="31" rx="15.5" fill="#2F95D3"/>
    <line x1="430" y1="155.5" x2="626" y2="155.5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 9" opacity=".55"/>
    <line x1="430" y1="196.5" x2="626" y2="196.5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 9" opacity=".55"/>
  </g>
</svg>
